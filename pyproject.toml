[project]
name = "sightline"
version = "0.1.0"
description = "Sightline Django API and exam video analysis backend."
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.0,<6.0",
  "djangorestframework>=3.15,<4.0",
  "django-cors-headers>=4.4,<5.0",
  "channels>=4.1,<5.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "python-dotenv>=1.0.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.34,<1.0",
  "numpy>=1.26,<2.0",
  "opencv-python-headless>=4.10,<5.0",
  "ultralytics>=8.2,<9.0",
  "lap>=0.5.12",
  "mediapipe==0.10.21",
  "langchain>=1.0,<2.0",
  "langchain-groq>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "chromadb>=1.0,<2.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[tool.uv]
package = false
