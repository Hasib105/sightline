name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sightline-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.images.outputs.api_image }}
      web-image: ${{ steps.images.outputs.web_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "api_image=${REGISTRY}/${repo}/api" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${repo}/web" >> "$GITHUB_OUTPUT"

      - name: Generate API metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.api_image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYYMMDD-HHmmss'}}-
            type=ref,event=branch

      - name: Generate web metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.web_image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'YYYYMMDD-HHmmss'}}-
            type=ref,event=branch

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-django/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            API_INTERNAL_BASE_URL=http://api:8000
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.PRODUCTION_PUBLIC_URL }}
            NEXT_PUBLIC_AUTH_BASE_URL=${{ secrets.PRODUCTION_PUBLIC_URL }}
            NEXT_PUBLIC_WEB_BASE_URL=${{ secrets.PRODUCTION_PUBLIC_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - name: Deploy on production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_API_IMAGE: ${{ needs.build.outputs.api-image }}:latest
          GHCR_WEB_IMAGE: ${{ needs.build.outputs.web-image }}:latest
          APP_PORT: ${{ secrets.PRODUCTION_APP_PORT }}
          PUBLIC_URL: ${{ secrets.PRODUCTION_PUBLIC_URL }}
          POSTGRES_DB: ${{ secrets.PRODUCTION_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PRODUCTION_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
          SIGHTLINE_SECRET_KEY: ${{ secrets.PRODUCTION_SIGHTLINE_SECRET_KEY }}
          SIGHTLINE_ALLOWED_HOSTS: ${{ secrets.PRODUCTION_ALLOWED_HOSTS }}
          SIGHTLINE_CORS_ALLOWED_ORIGINS: ${{ secrets.PRODUCTION_CORS_ALLOWED_ORIGINS }}
          SIGHTLINE_CSRF_TRUSTED_ORIGINS: ${{ secrets.PRODUCTION_CSRF_TRUSTED_ORIGINS }}
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.PRODUCTION_DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.PRODUCTION_DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.PRODUCTION_DJANGO_SUPERUSER_PASSWORD }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USERNAME }}
          password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          command_timeout: 30m
          envs: GHCR_PAT,GHCR_USERNAME,GHCR_API_IMAGE,GHCR_WEB_IMAGE,APP_PORT,PUBLIC_URL,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SIGHTLINE_SECRET_KEY,SIGHTLINE_ALLOWED_HOSTS,SIGHTLINE_CORS_ALLOWED_ORIGINS,SIGHTLINE_CSRF_TRUSTED_ORIGINS,DJANGO_SUPERUSER_USERNAME,DJANGO_SUPERUSER_EMAIL,DJANGO_SUPERUSER_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR="/opt/sightline"
            SUDO=""

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed"
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Neither docker compose nor docker-compose is installed"
              exit 1
            fi

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            if [ ! -d "$DEPLOY_DIR" ] || [ ! -w "$DEPLOY_DIR" ]; then
              if [ "$(id -u)" -ne 0 ]; then
                if ! command -v sudo >/dev/null 2>&1; then
                  echo "$DEPLOY_DIR is not writable and sudo is not installed"
                  exit 1
                fi
                SUDO="sudo"
              fi

              $SUDO mkdir -p "$DEPLOY_DIR"
              $SUDO chown "$(id -u):$(id -g)" "$DEPLOY_DIR"
            fi

            mkdir -p "$DEPLOY_DIR/nginx"
            cd "$DEPLOY_DIR"

            cat > nginx/default.conf <<'NGINX_EOF'
            map $http_upgrade $connection_upgrade {
                default upgrade;
                '' close;
            }

            upstream sightline_api {
                server api:8000;
            }

            upstream sightline_web {
                server web:3000;
            }

            server {
                listen 80;
                server_name _;

                client_max_body_size 2g;

                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                location = /nginx-health {
                    access_log off;
                    return 204;
                }

                location /static/ {
                    alias /var/www/sightline/static/;
                    access_log off;
                    expires 1h;
                    add_header Cache-Control "public";
                    try_files $uri =404;
                }

                location /media/ {
                    alias /var/www/sightline/media/;
                    expires 1h;
                    add_header Cache-Control "public";
                    try_files $uri =404;
                }

                location /ws/ {
                    proxy_pass http://sightline_api;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection $connection_upgrade;
                    proxy_read_timeout 3600s;
                    proxy_send_timeout 3600s;
                }

                location ~ ^/(api|auth|admin)(/|$) {
                    proxy_pass http://sightline_api;
                    proxy_read_timeout 300s;
                    proxy_send_timeout 300s;
                }

                location / {
                    proxy_pass http://sightline_web;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection $connection_upgrade;
                    proxy_read_timeout 300s;
                    proxy_send_timeout 300s;
                }
            }
            NGINX_EOF

            cat > docker-compose.yml <<'COMPOSE_EOF'
            services:
              db:
                image: postgres:16-alpine
                container_name: sightline-db
                environment:
                  POSTGRES_DB: ${POSTGRES_DB:-sightline}
                  POSTGRES_USER: ${POSTGRES_USER:-sightline}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - sightline-postgres:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sightline} -d ${POSTGRES_DB:-sightline}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 10s
                restart: unless-stopped
                networks:
                  - sightline

              redis:
                image: redis:7-alpine
                container_name: sightline-redis
                command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
                volumes:
                  - sightline-redis:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                restart: unless-stopped
                networks:
                  - sightline

              api:
                image: ${GHCR_API_IMAGE}
                container_name: sightline-api
                env_file:
                  - .env
                environment:
                  DATABASE_URL: postgres://${POSTGRES_USER:-sightline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sightline}
                  CELERY_BROKER_URL: redis://redis:6379/0
                  SIGHTLINE_DEBUG: "0"
                  SIGHTLINE_COLLECTSTATIC: "1"
                volumes:
                  - sightline-static:/app/apps/api-django/staticfiles
                  - sightline-media:/app/apps/api-django/media
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/ >/dev/null || exit 1"]
                  interval: 10s
                  timeout: 5s
                  retries: 30
                  start_period: 60s
                restart: unless-stopped
                networks:
                  - sightline

              worker:
                image: ${GHCR_API_IMAGE}
                container_name: sightline-worker
                command: celery -A sightline_api worker -l info
                env_file:
                  - .env
                environment:
                  DATABASE_URL: postgres://${POSTGRES_USER:-sightline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sightline}
                  CELERY_BROKER_URL: redis://redis:6379/0
                  SIGHTLINE_DEBUG: "0"
                  SIGHTLINE_SKIP_MIGRATIONS: "1"
                  SIGHTLINE_COLLECTSTATIC: "0"
                  SIGHTLINE_ANALYSIS_THREAD_FALLBACK: "0"
                  EXAM_AI_ANALYSIS_FPS: ${EXAM_AI_ANALYSIS_FPS:-2.0}
                  EXAM_AI_MODEL_SIZE: ${EXAM_AI_MODEL_SIZE:-n}
                volumes:
                  - sightline-media:/app/apps/api-django/media
                depends_on:
                  api:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                restart: unless-stopped
                networks:
                  - sightline

              web:
                image: ${GHCR_WEB_IMAGE}
                container_name: sightline-web
                env_file:
                  - .env
                environment:
                  API_INTERNAL_BASE_URL: http://api:8000
                  NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL}
                  NEXT_PUBLIC_AUTH_BASE_URL: ${PUBLIC_URL}
                  NEXT_PUBLIC_WEB_BASE_URL: ${PUBLIC_URL}
                depends_on:
                  api:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
                  interval: 10s
                  timeout: 5s
                  retries: 30
                  start_period: 60s
                restart: unless-stopped
                networks:
                  - sightline

              nginx:
                image: nginx:1.27-alpine
                container_name: sightline-nginx
                ports:
                  - "${APP_PORT:-80}:80"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                  - sightline-static:/var/www/sightline/static:ro
                  - sightline-media:/var/www/sightline/media:ro
                depends_on:
                  api:
                    condition: service_healthy
                  web:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
                  interval: 10s
                  timeout: 5s
                  retries: 30
                restart: unless-stopped
                networks:
                  - sightline

            volumes:
              sightline-postgres:
              sightline-redis:
              sightline-static:
              sightline-media:

            networks:
              sightline:
                driver: bridge
            COMPOSE_EOF

            cat > .env <<ENV_EOF
            GHCR_API_IMAGE=${GHCR_API_IMAGE}
            GHCR_WEB_IMAGE=${GHCR_WEB_IMAGE}
            APP_PORT=${APP_PORT:-80}
            PUBLIC_URL=${PUBLIC_URL}
            POSTGRES_DB=${POSTGRES_DB:-sightline}
            POSTGRES_USER=${POSTGRES_USER:-sightline}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            SIGHTLINE_SECRET_KEY=${SIGHTLINE_SECRET_KEY}
            SIGHTLINE_ALLOWED_HOSTS=${SIGHTLINE_ALLOWED_HOSTS}
            SIGHTLINE_CORS_ALLOWED_ORIGINS=${SIGHTLINE_CORS_ALLOWED_ORIGINS}
            SIGHTLINE_CSRF_TRUSTED_ORIGINS=${SIGHTLINE_CSRF_TRUSTED_ORIGINS}
            SIGHTLINE_ANALYSIS_THREAD_FALLBACK=0
            EXAM_AI_ANALYSIS_FPS=2.0
            EXAM_AI_MODEL_SIZE=n
            NEXT_PUBLIC_API_BASE_URL=${PUBLIC_URL}
            NEXT_PUBLIC_AUTH_BASE_URL=${PUBLIC_URL}
            NEXT_PUBLIC_WEB_BASE_URL=${PUBLIC_URL}
            API_INTERNAL_BASE_URL=http://api:8000
            DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
            DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
            DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
            ENV_EOF

            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d --remove-orphans

            echo "Initial service status:"
            $COMPOSE_CMD ps

            echo "Waiting for nginx to become healthy..."
            for i in $(seq 1 60); do
              if $COMPOSE_CMD ps nginx | grep -q "healthy"; then
                echo "Sightline is healthy"
                break
              fi

              if [ "$i" -eq 60 ]; then
                echo "Deployment failed health checks"
                $COMPOSE_CMD logs api web worker nginx
                $COMPOSE_CMD ps
                exit 1
              fi

              sleep 2
            done

            if [ -n "${DJANGO_SUPERUSER_PASSWORD:-}" ]; then
              $COMPOSE_CMD exec -T api python manage.py createsuperuser --noinput || true
            fi

            docker system prune -af --filter "until=24h" || true
            $COMPOSE_CMD ps

      - name: Send deployment notification to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PRODUCTION_DISCORD_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "Discord webhook secret is not configured; skipping notification."
            exit 0
          fi

          if [ "${DEPLOY_STATUS}" = "success" ]; then
            COLOR=5763719
          elif [ "${DEPLOY_STATUS}" = "failure" ]; then
            COLOR=15548997
          else
            COLOR=16705372
          fi

          payload=$(cat <<EOF
          {
            "username": "Sightline Deploy",
            "embeds": [
              {
                "title": "Production deployment ${DEPLOY_STATUS}",
                "url": "${WORKFLOW_URL}",
                "color": ${COLOR},
                "fields": [
                  { "name": "Repository", "value": "\`${GITHUB_REPOSITORY}\`", "inline": true },
                  { "name": "Branch", "value": "\`${GITHUB_REF_NAME}\`", "inline": true },
                  { "name": "Actor", "value": "\`${GITHUB_ACTOR}\`", "inline": true },
                  { "name": "Commit", "value": "\`${GITHUB_SHA}\`", "inline": false }
                ]
              }
            ]
          }
          EOF
          )

          curl --fail --show-error --silent \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${DISCORD_WEBHOOK_URL}"
