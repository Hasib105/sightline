services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sightline
      POSTGRES_USER: sightline
      POSTGRES_PASSWORD: sightline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sightline -d sightline"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - sightline-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.18.1
    volumes:
      - sightline-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6333:6333"

  api:
    build:
      context: .
      dockerfile: apps/api-django/Dockerfile
    environment:
      DATABASE_URL: postgres://sightline:sightline@db:5432/sightline
      CELERY_BROKER_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      SIGHTLINE_ALLOWED_HOSTS: localhost,127.0.0.1,api,nginx
      SIGHTLINE_CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000
      SIGHTLINE_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000
      SIGHTLINE_DEBUG: "1"
      SIGHTLINE_SECRET_KEY: dev-only-sightline-secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
    volumes:
      - sightline-static:/app/apps/api-django/staticfiles
      - sightline-media:/app/apps/api-django/media

  worker:
    build:
      context: .
      dockerfile: apps/api-django/Dockerfile
    command: celery -A sightline_api worker -l info
    environment:
      DATABASE_URL: postgres://sightline:sightline@db:5432/sightline
      CELERY_BROKER_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      SIGHTLINE_DEBUG: "1"
      SIGHTLINE_SECRET_KEY: dev-only-sightline-secret
      SIGHTLINE_SKIP_MIGRATIONS: "1"
      SIGHTLINE_COLLECTSTATIC: "0"
      SIGHTLINE_ANALYSIS_THREAD_FALLBACK: "0"
      EXAM_AI_ANALYSIS_FPS: "2.0"
      EXAM_AI_MODEL_SIZE: n
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - sightline-media:/app/apps/api-django/media

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_BASE_URL: http://api:8000
        NEXT_PUBLIC_API_BASE_URL: http://localhost
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost
        NEXT_PUBLIC_WEB_BASE_URL: http://localhost
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost
      NEXT_PUBLIC_AUTH_BASE_URL: http://localhost
      NEXT_PUBLIC_WEB_BASE_URL: http://localhost
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - sightline-static:/var/www/sightline/static:ro
      - sightline-media:/var/www/sightline/media:ro

volumes:
  sightline-postgres:
  sightline-static:
  sightline-media:
  sightline-qdrant:
