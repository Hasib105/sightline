services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sightline
      POSTGRES_USER: sightline
      POSTGRES_PASSWORD: sightline
    ports:
      - "5432:5432"
    volumes:
      - sightline-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  sightline-postgres:

